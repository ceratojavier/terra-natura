# Copia del workflow de deploy — pegar en .github/workflows/deploy-pages.yml en GitHub
# (el push desde Cursor puede fallar sin permiso "workflow" en el token de GitHub)

name: Deploy sitio a GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/public/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/public

      - name: Publicar en GitHub Pages
        uses: actions/deploy-pages@v4
