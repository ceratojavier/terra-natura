# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: terra-natura-api
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: "false"
      - key: PUBLIC_SITE_URL
        value: https://alpinasterranatura.com.ar
      - key: DATABASE_URL
        value: sqlite:////app/data/terra_natura.db
      - key: SECRET_KEY
        generateValue: true
      - key: ICAL_SYNC_INTERVAL_MIN
        value: "15"
      - key: ICAL_SYNC_ON_STARTUP
        value: "true"
      - key: WHATSAPP_OWNER_PHONE
        value: "5493541571190"
      # Configurar en Render Dashboard (Environment):
      # WHATSAPP_VERIFY_TOKEN, WHATSAPP_CLOUD_TOKEN, WHATSAPP_PHONE_NUMBER_ID
