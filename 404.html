<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cabañas Alpinas Terra Natura — Programa</title>
  <script>
    (function () {
      function isAppPath(path) {
        return path === "/app" || path.indexOf("/app/") === 0;
      }
      var path = window.location.pathname || "";
      var search = window.location.search || "";
      var hash = window.location.hash || "";
      if (isAppPath(path)) {
        var sub = path.replace(/^\/app\/?/, "") || "hoy";
        if (sub && sub !== "index.html" && sub.indexOf(".") === -1) {
          var dest =
            "/app/index.html?_r=" +
            encodeURIComponent(sub.charAt(0) === "/" ? sub : "/" + sub) +
            search +
            hash;
          var meta = document.createElement("meta");
          meta.httpEquiv = "refresh";
          meta.content = "0;url=" + dest;
          document.head.appendChild(meta);
          window.location.replace(dest);
          return;
        }
        window.location.replace("/app/");
        return;
      }
      if (path === "/entrar" || path === "/programa") {
        window.location.replace("/app/");
        return;
      }
      window.location.replace("/");
    })();
  </script>
</head>
<body>
  <p style="font-family: system-ui, sans-serif; padding: 2rem">
    Abriendo el programa… Si no pasa nada,
    <a href="/app/">entrá por acá</a>.
  </p>
</body>
</html>
